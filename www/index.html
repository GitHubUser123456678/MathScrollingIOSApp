<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>MathScroll</title>
  <meta name="description" content="An endless feed of maths problems, theorems, concepts and sequences.">
  <meta name="theme-color" content="#0d0e12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MathScroll">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/katex/katex.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="level-btn" id="levelBtn" aria-label="Your progress"><svg viewBox="0 0 36 36" class="ring"><circle cx="18" cy="18" r="15"/><circle class="prog" cx="18" cy="18" r="15"/></svg><b>1</b></button>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Feed"></nav>
    <button class="icon-btn" id="searchBtn" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    </button>
  </header>
  <nav class="bottombar" aria-label="Main">
    <button data-nav="home" class="on" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button data-nav="learn" aria-label="Learn"><svg viewBox="0 0 24 24"><path d="M3 9l9-4 9 4-9 4-9-4z"/><path d="M7 11v4c0 1.5 2.2 3 5 3s5-1.5 5-3v-4"/></svg><span>Learn</span></button>
    <button id="createBtn" class="nav-plus" aria-label="New post"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-nav="games" aria-label="Games"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="10" rx="4"/><path d="M8 11v4M6 13h4"/><circle cx="15.5" cy="12" r=".9"/><circle cx="17.5" cy="14.5" r=".9"/></svg><span>Games</span></button>
    <button id="profileBtn" data-nav="me" aria-label="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg><span>Me</span></button>
  </nav>

  <div class="xpbar" id="xpbar" aria-hidden="true"><span class="fill"></span><span class="pips"></span></div>
  <button class="chest-btn" id="chestBtn" hidden aria-label="Open your chest">🎁<b></b></button>
  <div class="streak" id="streak" hidden></div>

  <main id="feed" class="feed" aria-live="polite"></main>

  <!-- Bottom sheet used for solutions, proofs, saved items and settings -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-grip" id="sheetGrip"><span></span></div>
    <header class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" id="sheetClose" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
