# Builds MathScroll.ipa on a free GitHub-hosted Mac. No Mac or Apple account needed for the build.
# Download the IPA from the run's "Artifacts" section, then install it with Sideloadly (see README).
name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'ios/**', 'capacitor.config.json', 'package.json', '.github/workflows/ios.yml']

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into the iOS project
        run: npx cap sync ios

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr MathScroll.ipa Payload
          ls -lh MathScroll.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MathScroll-ipa
          path: MathScroll.ipa
          retention-days: 30
